<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дафтари Электронии Беморон</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1, h2 { text-align: center; color: #1a5276; margin-bottom: 20px; }
    
    /* Шакли ворид кардани рамз */
    #auth-screen { text-align: center; margin-top: 50px; }
    #auth-screen input { width: 250px; padding: 12px; font-size: 18px; text-align: center; border: 2px solid #1a5276; border-radius: 8px; margin-bottom: 15px; }
    
    /* Танзимоти тугмаҳо */
    .btn { background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; transition: 0.3s; }
    .btn:hover { background-color: #219150; }
    .btn-danger { background-color: #e74c3c; }
    .btn-danger:hover { background-color: #c0392b; }
    .btn-blue { background-color: #2980b9; }
    .btn-blue:hover { background-color: #1f618d; }
    
    /* Форма ва ҷустуҷӯ */
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .form-group input, .form-group textarea { flex: 1 1 45%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .form-group textarea { flex: 1 1 100%; height: 80px; }
    .search-box { margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px; border: 2px solid #2980b9; border-radius: 8px; font-size: 16px; }
    
    /* Ҷадвали беморон */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #1a5276; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .hidden { display: none; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #eef2f5; padding: 10px 15px; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- ЭКРАНИ РАМЗ (АВТОРИЗАЦИЯ) -->
  <div id="auth-screen">
    <h2>🔒 Дафтари Электронии Беморон</h2>
    <p style="margin-bottom: 15px;">Лутфан рамзи воридшавиро нависед:</p>
    <input type="password" id="pass-input" placeholder="Рамзро ворид кунед"><br>
    <button class="btn btn-blue" onclick="checkPassword()">Ворид шудан</button>
    <p id="auth-error" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- ЭКРАНИ АСОСИИ БАРНОМА -->
  <div id="app-screen" class="hidden">
    <div class="status-bar">
      <span>👤 Лаборатория / Дафтари беморон</span>
      <div>
        <button class="btn btn-blue" onclick="exportData()">💾 Сабти маълумот (Backup)</button>
        <button class="btn btn-blue" onclick="importData()">📂 Бор кардан (Import)</button>
        <button class="btn btn-danger" onclick="logout()">Баромад</button>
      </div>
    </div>

    <!-- ЧӮСТУҶӮ -->
    <div class="search-box">
      <input type="text" id="search-input" onkeyup="searchPatients()" placeholder="🔍 Ҷустуҷӯ (аз рӯи ном, сол ё адрес)...">
    </div>

    <!-- ФОРМАИ НАВИШТАНИ БЕМОРИ НАВ -->
    <h2>➕ Илова кардани бемори нав</h2>
    <form id="patient-form" onsubmit="addPatient(event)">
      <div class="form-group">
        <input type="text" id="p-name" placeholder="Ном ва Фамилия" required>
        <input type="number" id="p-year" placeholder="Соли таваллуд" required>
        <input type="text" id="p-address" placeholder="Адрес / Суроға" required>
        <input type="text" id="p-phone" placeholder="Телефон">
        <textarea id="p-notes" placeholder="Таҳлилҳо, нишонаҳо, диагноз ё қайдҳои дигар..."></textarea>
      </div>
      <button type="submit" class="btn">Сабт кардан</button>
    </form>

    <hr style="margin: 25px 0;">

    <!-- РӮЙХАТИ БЕМОРОН -->
    <h2>📋 Рӯйхати беморон</h2>
    <div style="overflow-x:auto;">
      <table id="patient-table">
        <thead>
          <tr>
            <th>Сана</th>
            <th>Ном ва Фамилия</th>
            <th>Сол</th>
            <th>Адрес</th>
            <th>Телефон</th>
            <th>Қайдҳо/Таҳлилҳо</th>
            <th>Амал</th>
          </tr>
        </thead>
        <tbody id="patient-list">
          <!-- Маълумот дар ин ҷо пайдо мешавад -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // Рамзи пешфарз: 1234 (метавонед тағйир диҳед)
  const SECRET_PASS = "1234";
  let patients = JSON.parse(localStorage.getItem("med_patients")) || [];

  function checkPassword() {
    const input = document.getElementById("pass-input").value;
    if (input === SECRET_PASS) {
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      renderPatients();
    } else {
      document.getElementById("auth-error").innerText = "Рамз нодуруст аст!";
    }
  }

  function logout() {
    document.getElementById("auth-screen").classList.remove("hidden");
    document.getElementById("app-screen").classList.add("hidden");
    document.getElementById("pass-input").value = "";
  }

  function addPatient(e) {
    e.preventDefault();
    const newPatient = {
      id: Date.now(),
      date: new Date().toLocaleDateString('ru-RU'),
      name: document.getElementById("p-name").value,
      year: document.getElementById("p-year").value,
      address: document.getElementById("p-address").value,
      phone: document.getElementById("p-phone").value,
      notes: document.getElementById("p-notes").value
    };

    patients.unshift(newPatient);
    saveData();
    renderPatients();
    document.getElementById("patient-form").reset();
  }

  function saveData() {
    localStorage.setItem("med_patients", JSON.stringify(patients));
  }

  function renderPatients(dataToRender = patients) {
    const list = document.getElementById("patient-list");
    list.innerHTML = "";

    if (dataToRender.length === 0) {
      list.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Ҳеҷ бемор ёфт нашуд</td></tr>";
      return;
    }

    dataToRender.forEach(p => {
      const row = `<tr>
        <td>${p.date}</td>
        <td><b>${p.name}</b></td>
        <td>${p.year}</td>
        <td>${p.address}</td>
        <td>${p.phone || '-'}</td>
        <td>${p.notes || '-'}</td>
        <td><button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deletePatient(${p.id})">Ўчириш</button></td>
      </tr>`;
      list.innerHTML += row;
    });
  }

  function deletePatient(id) {
    if (confirm("Оё мехоҳед ин беморро аз рӯйхат озод/пок кунед?")) {
      patients = patients.filter(p => p.id !== id);
      saveData();
      renderPatients();
    }
  }

  function searchPatients() {
    const query = document.getElementById("search-input").value.toLowerCase();
    const filtered = patients.filter(p => 
      p.name.toLowerCase().includes(query) ||
      p.address.toLowerCase().includes(query) ||
      p.year.toString().includes(query) ||
      p.notes.toLowerCase().includes(query)
    );
    renderPatients(filtered);
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(patients));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "patients_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.readAsText(file, 'UTF-8');
      reader.onload = readerEvent => {
        const content = readerEvent.target.result;
        try {
          patients = JSON.parse(content);
          saveData();
          renderPatients();
          alert("Маълумот бомуваффақият бор карда шуд!");
        } catch (err) {
          alert("Хатогӣ дар файли боршуда!");
        }
      }
    }
    input.click();
  }
</script>

</body>
</html>
